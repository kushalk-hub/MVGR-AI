[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mvgr-ai"
version = "0.1.0"
description = "Multi-view graph-based analysis of human, AI, paraphrased and deeply paraphrased text"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - research use only" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "PyYAML>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
graph = ["networkx>=3.3"]
baseline = ["scikit-learn>=1.5"]
syntactic = ["spacy>=3.7"]
neo4j = ["neo4j>=5.24", "python-dotenv>=1.0"]
gnn = ["torch>=2.3", "torch-geometric>=2.5"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# Module C (GLTR). Optional: without it the GLTR branch reports as unavailable.
# CPU-only reference build: see requirements/gltr.txt for the pinned +cpu torch.
gltr = ["torch>=2.6", "transformers>=5.23", "tokenizers>=0.23.1,<0.24.0", "safetensors>=0.8.0"]
# The deterministic detection branch: classical classifiers over the
# stylometric / writeprints / GLTR features.
detection = ["scikit-learn>=1.5", "xgboost>=2.1", "matplotlib>=3.9", "shap>=0.46"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mvgr = "mvgr:main"

[tool.setuptools]
py-modules = ["mvgr"]

[tool.setuptools.packages.find]
include = [
    "shared*",
    "dataset_audit*",
    "deterministic*",
    "baseline*",
    "fingerprinting*",
    "watermark*",
    "gltr*",
    "fusion*",
    "detection*",
    "graph_engine*",
    "evaluation*",
    "backend*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:jsonschema.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
